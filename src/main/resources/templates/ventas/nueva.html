<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaHub · Boletas</title><style>body{font:16px system-ui;background:#f1f5f9;color:#17213a;margin:0}main{max-width:1000px;margin:35px auto;padding:30px;background:white;border-radius:14px}a,button{display:inline-block;padding:10px;color:#164aad}button{cursor:pointer}input,select{padding:10px;max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.error{background:#fee2e2;padding:15px}.total{text-align:right;font-size:22px}@media print{.acciones{display:none}body{background:white}main{margin:0;padding:0}}
:root{--azul:#2346c7;--rojo:#b42335}body{background:linear-gradient(135deg,#e9eefb,#f8fafc);min-height:100vh}main{box-shadow:0 18px 60px #17213a12;border:1px solid #e3e9f3}h1{color:#18378c;letter-spacing:-1px}h2{font-size:22px}a,button{border:1px solid #d4deed;border-radius:9px;text-decoration:none;background:#fff;font:600 14px system-ui;padding:11px 17px;transition:background .15s}a:hover,button:hover{background:#edf2ff}nav,.acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}.primario,button[type=submit]{background:var(--azul);color:white;border-color:var(--azul)}.primario:hover,button[type=submit]:hover{background:#17359f}.peligro,button.quitar{background:#fff1f2;color:var(--rojo);border-color:#fecdd3}.peligro:hover,button.quitar:hover{background:#ffe0e5}th{background:#f0f4fc;color:#33476d;font-size:13px;text-transform:uppercase}td{font-size:14px}.total{background:#eef3ff;border-radius:12px;padding:22px;color:#18378c}.mensaje{background:#e6f7ee;color:#17643c;border-radius:8px;padding:15px}select,input{border:1px solid #ccd6e5;border-radius:8px;background:white}.acciones form{margin:0}.tabla{overflow-x:auto}@media(max-width:640px){main{margin:12px;padding:18px}td,th{padding:8px}a,button{padding:10px}select{max-width:220px}}@media print{main{box-shadow:none;border:none}.total,th{background:white}a,button{display:none}}
</style></head><body><main><nav><a th:href="@{/}">Inicio</a><a th:href="@{/ventas}">Ver boletas</a><a class="primario" th:href="@{/ventas/nueva}">Nueva boleta</a></nav><h1>Registrar boleta</h1><p>Seleccione al cliente y agregue los mangas. Los precios y el stock se validan al guardar.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/ventas}" th:object="${venta}"><label>Cliente <select required th:field="*{idCliente}"><option value="">Seleccione</option><option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.dni + ' — ' + c.nombres + ' ' + c.apellidos}"></option></select></label><table><thead><tr><th>Manga / precio / stock</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody id="lineas"></tbody></table><button type="button" id="agregar">Agregar manga</button><p class="total">Total estimado: S/ <strong id="total">0.00</strong></p><button type="submit">Guardar y generar boleta</button></form><template id="fila"><tr><td><select required><option value="">Seleccione manga</option><option th:each="m : ${mangas}" th:value="${m.idManga}" th:attr="data-precio=${m.precio},data-stock=${m.stock}" th:text="${m.titulo + ' / Tomo ' + m.numTomo + ' / S/ ' + m.precio + ' / Stock: ' + m.stock}"></option></select></td><td><input type="number" min="1" step="1" value="1" required></td><td class="subtotal">0.00</td><td><button type="button" class="quitar" aria-label="Eliminar línea">Eliminar</button></td></tr></template><script th:inline="javascript">
const previos = /*[[${venta.detalles}]]*/ [];
const lineas=document.getElementById('lineas');
function calcular(){let centavos=0;[...lineas.rows].forEach((fila,i)=>{const s=fila.querySelector('select'),n=fila.querySelector('input');s.name=`detalles[${i}].idManga`;n.name=`detalles[${i}].cantidad`;const o=s.selectedOptions[0];n.max=o.dataset.stock||2147483647;const sub=Math.round(Number(o.dataset.precio||0)*100)*Number(n.value||0);fila.querySelector('.subtotal').textContent=(sub/100).toFixed(2);centavos+=sub});document.getElementById('total').textContent=(centavos/100).toFixed(2)}
function agregar(d){if(lineas.rows.length>=100)return;const f=document.getElementById('fila').content.cloneNode(true);if(d){f.querySelector('select').value=d.idManga;f.querySelector('input').value=d.cantidad}lineas.appendChild(f);calcular()}
document.getElementById('agregar').onclick=()=>agregar();lineas.oninput=calcular;lineas.onchange=calcular;lineas.onclick=e=>{if(e.target.classList.contains('quitar')){e.target.closest('tr').remove();calcular()}};
if(previos&&previos.length)previos.forEach(agregar);else agregar();
</script></main></body></html>

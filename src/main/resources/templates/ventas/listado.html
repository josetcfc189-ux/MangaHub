<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaHub · Boletas</title><style>body{font:16px system-ui;background:#f1f5f9;color:#17213a;margin:0}main{max-width:1000px;margin:35px auto;padding:30px;background:white;border-radius:14px}a,button{display:inline-block;padding:10px;color:#164aad}button{cursor:pointer}input,select{padding:10px;max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.error{background:#fee2e2;padding:15px}.total{text-align:right;font-size:22px}@media print{.acciones{display:none}body{background:white}main{margin:0;padding:0}}
:root{--azul:#2346c7;--rojo:#b42335}body{background:linear-gradient(135deg,#e9eefb,#f8fafc);min-height:100vh}main{box-shadow:0 18px 60px #17213a12;border:1px solid #e3e9f3}h1{color:#18378c;letter-spacing:-1px}h2{font-size:22px}a,button{border:1px solid #d4deed;border-radius:9px;text-decoration:none;background:#fff;font:600 14px system-ui;padding:11px 17px;transition:background .15s}a:hover,button:hover{background:#edf2ff}nav,.acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}.primario,button[type=submit]{background:var(--azul);color:white;border-color:var(--azul)}.primario:hover,button[type=submit]:hover{background:#17359f}.peligro,button.quitar{background:#fff1f2;color:var(--rojo);border-color:#fecdd3}.peligro:hover,button.quitar:hover{background:#ffe0e5}th{background:#f0f4fc;color:#33476d;font-size:13px;text-transform:uppercase}td{font-size:14px}.total{background:#eef3ff;border-radius:12px;padding:22px;color:#18378c}.mensaje{background:#e6f7ee;color:#17643c;border-radius:8px;padding:15px}select,input{border:1px solid #ccd6e5;border-radius:8px;background:white}.acciones form{margin:0}.tabla{overflow-x:auto}@media(max-width:640px){main{margin:12px;padding:18px}td,th{padding:8px}a,button{padding:10px}select{max-width:220px}}@media print{main{box-shadow:none;border:none}.total,th{background:white}a,button{display:none}}
</style></head><body><main><nav><a th:href="@{/}">Inicio</a><a class="primario" th:href="@{/ventas/nueva}">Nueva boleta</a></nav><h1>Boletas de venta</h1><p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" th:if="${error}" th:text="${error}"></p><table><thead><tr><th>Número interno</th><th>Fecha</th><th>Cliente</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="v : ${ventas}"><td th:text="${v.idVenta}"></td><td th:text="${#temporals.format(v.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.cliente.nombres + ' ' + v.cliente.apellidos}"></td><td th:text="${'S/ ' + v.montoTotal}"></td><td><a th:href="@{/ventas/{id}(id=${v.idVenta})}">Ver boleta</a><form style="display:inline" method="post" th:action="@{/ventas/{id}/eliminar(id=${v.idVenta})}" onsubmit="return confirm('¿Eliminar esta boleta y devolver las cantidades al stock?');"><button type="submit" class="peligro">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(ventas)}"><td colspan="5">Aún no hay boletas registradas.</td></tr></tbody></table></main></body></html>

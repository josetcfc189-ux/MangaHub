<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MangaHub - Inicio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary">
		<div class="container">
			<span class="navbar-brand fs-4">MangaHub</span>
			<a th:href="@{/logout}" class="btn btn-danger">
				Cerrar sesión
			</a>
		</div>
	</nav>

	<div class="container py-5">

		<div class="card shadow border-0 mx-auto" style="max-width: 950px;">

			<div class="card-header bg-primary text-white text-center py-3">
				<h3 class="mb-0">Bienvenido a MangaHub</h3>
			</div>

			<div class="card-body p-4 p-md-5">

				<div class="text-center mb-4">

					<h5 class="fw-bold">Sistema de Gestión de Mangas</h5>

					<p class="mb-2" th:if="${session.usuario != null}">
						Usuario:
						<strong th:text="${session.usuario}"></strong>
					</p>

					<p th:if="${session.rol != null}">
						Rol:
						<span class="badge bg-success" th:text="${session.rol}"></span>
					</p>

				</div>

				<hr>

				<h4 class="text-center mb-4">Menú Principal</h4>
<a th:href="@{/ventas}" class="btn btn-primary w-100 py-3 mb-3">Boletas de venta</a>


				<div class="row g-3 justify-content-center">

					<div class="col-md-6">
						<a th:href="@{/mangas}" class="btn btn-primary w-100 py-3">
							Ver catálogo de mangas
						</a>
					</div>

					<div class="col-md-6" th:if="${session.rol == 'ADMIN'}">
						<a th:href="@{/mangas/nuevo}" class="btn btn-success w-100 py-3">
							Registrar nuevo manga
						</a>
					</div>

					<div class="col-md-6">
						<a th:href="@{/clientes}" class="btn btn-info text-white w-100 py-3">
							Gestionar clientes
						</a>
					</div>

				</div>

			</div>
		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<script th:inline="javascript">
		const bienvenida = /*[[${bienvenida}]]*/ null;

		if (bienvenida) {
			Swal.fire({
				icon: 'success',
				title: '¡Bienvenido a MangaHub!',
				text: 'Hola, ' + bienvenida + '. Has iniciado sesión correctamente.',
				confirmButtonText: 'Continuar',
				confirmButtonColor: '#198754'
			});
		}
	</script>

</body>

</html>
